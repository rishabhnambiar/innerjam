<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Innerjam – scales and chords for quick jams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1EA; --surface:#FEFCF8; --sunk:#EDE5D6; --ink:#2A1A0D; --muted:#7C6249;
  --line:#D4C5AD; --accent:#7B3F20; --accent-ink:#FFFFFF;
  --maj:#C27A0A; --min:#13807A; --dim:#B23E66; --aug:#7B3F20; --hl:#F2B65A; --hl-ink:#231600;
  --key-white:#FEFCF8; --key-black:#2A1A0D;
  --wood:#8B5A2B; --wood-dark:#6E431D; --wood-ink:#FFF6EA;
  --dock:0px;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#17162B; --surface:#221F3B; --sunk:#1C1A33; --ink:#EEEBFA; --muted:#A9A5CA;
    --line:#38345C; --accent:#8F9CFF; --accent-ink:#13122A;
    --maj:#F2B65A; --min:#4FC2B7; --dim:#EC86AA; --aug:#8F9CFF; --hl:#F2B65A; --hl-ink:#231600;
    --key-white:#E6E3F3; --key-black:#13122A;
    --wood:#B47A45; --wood-dark:#8E5A2E; --wood-ink:#1E140B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#17162B; --surface:#221F3B; --sunk:#1C1A33; --ink:#EEEBFA; --muted:#A9A5CA;
  --line:#38345C; --accent:#8F9CFF; --accent-ink:#13122A;
  --maj:#F2B65A; --min:#4FC2B7; --dim:#EC86AA; --aug:#8F9CFF; --hl:#F2B65A; --hl-ink:#231600;
  --key-white:#E6E3F3; --key-black:#13122A;
  --wood:#B47A45; --wood-dark:#8E5A2E; --wood-ink:#1E140B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 120px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.brand{font-family:var(--serif);font-size:1.4rem;margin:0}
.lede{color:var(--muted);margin:0;font-size:.95rem;max-width:56ch}

/* Key picker */
.picker{display:grid;grid-template-columns:auto 1fr;gap:28px 40px;align-items:center;margin:18px 0 26px}
@media (max-width:760px){.picker{grid-template-columns:1fr;justify-items:center;gap:22px}}
.wheel{--wsz:clamp(250px,74vw,320px);position:relative;width:var(--wsz);height:var(--wsz);flex:none}
.wheel svg.ring{position:absolute;inset:0;width:100%;height:100%}
.wheel .note{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;
  border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:1rem;
  transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(var(--wsz) * -0.405)) rotate(calc(var(--a) * -1));
  transition:background .15s,color .15s,border-color .15s}
.wheel .note:hover{border-color:var(--accent)}
.wheel .note[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wheel .note.in-scale:not([aria-pressed="true"]){border-color:var(--muted)}
.wheel-center{position:absolute;inset:26%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.key-root{font-family:var(--serif);font-size:clamp(2.6rem,11vw,3.4rem);line-height:1}
.key-mode{color:var(--muted);font-size:.95rem;margin-top:6px}

.controls{display:flex;flex-direction:column;gap:22px;width:100%;max-width:560px}
.group h2{font-size:.9rem;font-weight:600;color:var(--muted);margin:0 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.92rem;font-weight:500}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill:disabled{opacity:.45}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:3px}
.mode b{font-family:var(--serif);font-weight:400;font-size:1.25rem;line-height:1.1}
.mode span{font-size:.8rem;color:var(--muted);line-height:1.3}
.mode:hover{border-color:var(--accent)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.mode[aria-pressed="true"] b{color:var(--accent)}
@media (max-width:420px){.mode span{display:none}.mode{align-items:center;text-align:center}}

/* Panel */
.panel{border-top:1px solid var(--line);padding-top:22px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel-head h2{font-family:var(--serif);font-weight:400;font-size:1.45rem;margin:0}
.subtabs{display:inline-flex;background:var(--sunk);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.sub{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:600;font-size:.92rem;color:var(--muted)}
.sub[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.btn{border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:8px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:120px}
select{border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:8px 10px;max-width:100%}
.field{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.field input[type=range]{width:120px;accent-color:var(--accent)}
.field strong{color:var(--ink);min-width:2.2em}
.check{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
.check input{accent-color:var(--accent);width:18px;height:18px}
.player{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
.player h3{width:100%;margin:0;font-size:.95rem;font-weight:600}

/* Scale view */
.degrees{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.deg{display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;border-radius:12px;background:var(--sunk);line-height:1.25;transition:background .1s}
.deg b{font-size:1.25rem}
.deg .f{font-family:var(--serif);font-size:1.05rem}
.deg .iv{font-size:.78rem;color:var(--muted)}
.deg.root{background:var(--accent);color:var(--accent-ink)}
.deg.root .iv{color:inherit}
.deg.alt{box-shadow:inset 0 0 0 1.5px var(--accent)}
.deg.alt .f{color:var(--accent)}
.deg.hl{background:var(--hl);color:var(--hl-ink)}
.deg.hl .iv,.deg.hl .f{color:inherit}
.formula{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:16px 0 0;font-size:.95rem}
.formula dt{color:var(--muted)}
.formula dd{margin:0;font-family:var(--serif)}

/* Chord grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--q);border-radius:6px 6px 12px 12px;padding:10px 10px 8px;display:flex;flex-direction:column;transition:transform .15s, box-shadow .15s}
.q-maj{--q:var(--maj)} .q-min{--q:var(--min)} .q-dim{--q:var(--dim)} .q-aug{--q:var(--aug)}
.card.now{box-shadow:0 0 0 3px var(--accent);transform:translateY(-2px)}
.card-top{display:flex;justify-content:space-between;align-items:center}
.num{font-family:var(--serif);font-size:1.05rem;color:var(--q)}
.add{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:1.2rem;line-height:1;font-weight:600}
.add:hover{border-color:var(--accent);color:var(--accent)}
.play{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:4px 0 2px;border-radius:8px;width:100%}
.play:hover .sym{color:var(--accent)}
.sym{font-family:var(--serif);font-size:1.9rem;line-height:1.15}
.notes{color:var(--muted);font-size:.85rem;letter-spacing:.02em}
.diagram{display:block;width:100%;margin-top:6px}
.diagram svg{display:block;width:100%;height:auto;max-height:150px}
.vnav{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:4px}
.vnav button,.shape-nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:1rem;line-height:1;flex:none}
.vnav span{font-size:.75rem;color:var(--muted);text-align:center;line-height:1.25}

/* Fretboard and keyboard */
.shape-nav{display:flex;align-items:center;gap:8px}
.shape-nav span{font-size:.9rem;min-width:14ch}
.board-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px 4px;-webkit-overflow-scrolling:touch}
.board-scroll svg{display:block;height:auto}
.fd.hl circle{fill:var(--hl)!important}
.fd.hl text{fill:var(--hl-ink)!important}
.keys-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.keys-wrap svg{display:block;width:100%;min-width:520px;height:auto}
.pk.hl{fill:var(--hl)!important}

/* Jam bar */
.jam{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.jam-inner{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center}
@media (max-width:760px){.jam-inner{grid-template-columns:1fr}}
.nowbox{display:flex;align-items:baseline;gap:10px;min-width:150px}
.now-sym{font-family:var(--serif);font-size:2.2rem;line-height:1}
.now-next{color:var(--muted);font-size:.85rem}
.prog{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:40px}
.chip{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);overflow:hidden}
.chip .c-play{border:0;background:transparent;padding:6px 4px 6px 12px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip .c-play::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--q)}
.chip .c-x{border:0;background:transparent;padding:6px 10px 6px 6px;color:var(--muted);font-size:1rem;line-height:1}
.chip.now{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip.now .c-x{color:var(--accent-ink)}
.empty{color:var(--muted);font-size:.9rem}
.jam-controls{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}

/* Wooden metronome */
.metro-btn{position:fixed;right:16px;bottom:calc(var(--dock) + 16px + env(safe-area-inset-bottom,0px));z-index:20;
  width:58px;height:58px;border-radius:18px 18px 14px 14px;border:0;
  background:linear-gradient(160deg,var(--wood),var(--wood-dark));color:var(--wood-ink);
  box-shadow:0 6px 16px rgba(60,30,10,.28), inset 0 1px 0 rgba(255,255,255,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.metro-btn svg{width:28px;height:28px}
.metro-btn .bpm-mini{font-size:.62rem;font-weight:700;line-height:1;margin-top:1px}
.pend{transform-origin:16px 25px}
.metro-btn.running .pend{animation:swing var(--period,1s) ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.metro-pop{position:fixed;right:16px;bottom:calc(var(--dock) + 84px + env(safe-area-inset-bottom,0px));z-index:20;
  width:min(280px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;
  box-shadow:0 12px 30px rgba(20,16,40,.22)}
.metro-pop h2{font-family:var(--serif);font-weight:400;font-size:1.15rem;margin:0 0 2px}
.metro-pop .sig{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.beats{display:flex;gap:8px;margin-bottom:12px}
.beats span{flex:1;height:10px;border-radius:5px;background:var(--sunk)}
.beats span.on{background:var(--wood)}
.beats span:first-child.on{background:var(--hl)}
.tempo-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tempo-row button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:1.2rem;font-weight:600}
.tempo-row output{flex:1;text-align:center;font-family:var(--serif);font-size:1.8rem;line-height:1}
.tempo-row small{display:block;font-family:var(--sans);font-size:.75rem;color:var(--muted)}
.metro-pop input[type=range]{width:100%;accent-color:var(--wood);margin:0 0 12px}
.metro-pop .btn.primary{width:100%;background:var(--wood);border-color:var(--wood);color:var(--wood-ink)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.metro-btn.running .pend{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Innerjam</h1>
    <p class="lede">Pick a root note and a scale, then choose what you want to work on.</p>
  </header>

  <section class="picker" aria-label="Choose a key">
    <div class="wheel" id="wheel">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40.5" fill="none" stroke="var(--line)" stroke-width="0.8"/>
        <circle cx="50" cy="50" r="24" fill="var(--surface)" stroke="var(--line)" stroke-width="0.6"/>
      </svg>
      <div class="wheel-center" aria-live="polite">
        <div class="key-root" id="keyRoot">C</div>
        <div class="key-mode" id="keyMode">major</div>
      </div>
    </div>
    <div class="controls">
      <div class="group">
        <h2 id="lblScale">Scale</h2>
        <div class="pills" id="scales" role="group" aria-labelledby="lblScale"></div>
      </div>
      <div class="group">
        <h2 id="lblMode">What do you want to work on?</h2>
        <div class="modes" role="group" aria-labelledby="lblMode">
          <button class="mode" data-panel="scale"><b>Scale</b><span>Degrees, intervals and a sing‑along player</span></button>
          <button class="mode" data-panel="guitar"><b>Guitar</b><span>Chords, triads and scale shapes</span></button>
          <button class="mode" data-panel="piano"><b>Piano</b><span>Chords and the scale on the keys</span></button>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" id="panel" hidden aria-live="off"></section>
</div>

<section class="jam" id="jam" aria-label="Progression looper" hidden>
  <div class="jam-inner">
    <div class="nowbox" aria-live="polite">
      <span class="now-sym" id="nowSym">–</span>
      <span class="now-next" id="nowNext">Press Play to loop</span>
    </div>
    <div class="prog" id="prog"></div>
    <div class="jam-controls">
      <button class="btn primary" id="playBtn">Play</button>
      <label class="sr" for="preset">Load a progression</label>
      <select id="preset"></select>
      <label class="field">Tempo <input type="range" id="bpm" min="50" max="180" step="1"><strong id="bpmVal">90</strong></label>
      <label class="field">Beats per chord
        <select id="beats"><option value="2">2</option><option value="4">4</option><option value="8">8</option></select>
      </label>
      <button class="btn" id="clearBtn">Clear</button>
    </div>
  </div>
</section>

<button class="metro-btn" id="metroBtn" aria-label="Metronome" aria-expanded="false" aria-controls="metroPop">
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <path d="M11 4h10l6 24H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <line x1="7" y1="22" x2="25" y2="22" stroke="currentColor" stroke-width="1.6"/>
    <g class="pend"><line x1="16" y1="25" x2="16" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="13.5" y="11" width="5" height="4" rx="1" fill="currentColor"/></g>
  </svg>
  <span class="bpm-mini" id="metroMini">120</span>
</button>
<div class="metro-pop" id="metroPop" role="dialog" aria-label="Metronome" hidden>
  <h2>Metronome</h2>
  <p class="sig">4/4, woodblock click</p>
  <div class="beats" id="metroBeats"><span></span><span></span><span></span><span></span></div>
  <div class="tempo-row">
    <button id="metroDown" aria-label="Slower">−</button>
    <output id="metroVal">120<small>BPM</small></output>
    <button id="metroUp" aria-label="Faster">+</button>
  </div>
  <label class="sr" for="metroRange">Metronome tempo</label>
  <input type="range" id="metroRange" min="40" max="220" step="1" value="120">
  <button class="btn primary" id="metroToggle">Start</button>
</div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* ---------- Music data ---------- */
const LET = ["C","D","E","F","G","A","B"];
const NAT = [0,2,4,5,7,9,11];
const PC_LABEL = ["C","D♭","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const FIFTHS = [0,7,2,9,4,11,6,1,8,3,10,5];
const NUMS = ["I","II","III","IV","V","VI","VII"];
const MODES = {
  major:{name:"Major", label:"major", steps:[0,2,4,5,7,9,11]},
  minor:{name:"Minor", label:"minor", steps:[0,2,3,5,7,8,10]},
  harmonic:{name:"Harmonic minor", label:"harmonic minor", steps:[0,2,3,5,7,8,11]},
  dorian:{name:"Dorian", label:"Dorian", steps:[0,2,3,5,7,9,10]},
  mixolydian:{name:"Mixolydian", label:"Mixolydian", steps:[0,2,4,5,7,9,10]},
  lydian:{name:"Lydian", label:"Lydian", steps:[0,2,4,6,7,9,11]},
  phrygian:{name:"Phrygian", label:"Phrygian", steps:[0,1,3,5,7,8,10]},
  locrian:{name:"Locrian", label:"Locrian", steps:[0,1,3,5,6,8,10]}
};
const PRESETS = {
  major:[[[0,4,5,3],"Pop anthem"],[[0,5,3,4],"Fifties"],[[5,3,0,4],"Heartfelt"],[[0,3,4,3],"Rock"],[[1,4,0],"Jazz turnaround"]],
  minor:[[[0,5,2,6],"Epic"],[[0,3,6,2],"Moody"],[[0,6,5,6],"Folk rock"],[[0,5,3,4],"Brooding"]],
  harmonic:[[[0,3,4,0],"Classic minor cadence"],[[0,5,1,4],"Dramatic"],[[0,4,5,4],"Flamenco feel"]],
  dorian:[[[0,3],"Dorian vamp"],[[0,3,6,0],"Soulful"],[[0,1,0,3],"Groove"]],
  mixolydian:[[[0,6,3,0],"Classic rock"],[[0,6,3],"Anthem vamp"],[[0,4,6,3],"Jam band"]],
  lydian:[[[0,1],"Dreamy vamp"],[[0,1,6,0],"Film score"]],
  phrygian:[[[0,1],"Phrygian vamp"],[[0,1,2,1],"Dark riff"],[[0,6,5,1],"Metal"]],
  locrian:[[[0,1],"Unsettled vamp"],[[0,1,6,0],"Tense"]]
};
const QUAL = {
  maj:{sym:"",cls:"maj",up:true,suf:""}, min:{sym:"m",cls:"min",up:false,suf:""},
  dim:{sym:"dim",cls:"dim",up:false,suf:"°"}, aug:{sym:"aug",cls:"aug",up:true,suf:"+"},
  "7":{sym:"7",cls:"maj",up:true,suf:"7"}, maj7:{sym:"maj7",cls:"maj",up:true,suf:"maj7"},

    const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  const f = accent ? 1250 : 880;
  const n = c.createBufferSource(), bp = c.createBiquadFilter(), gn = c.createGain();
  n.buffer = noiseBuf; bp.type = "bandpass"; bp.frequency.value = f*1.6; bp.Q.value = 6;
  gn.gain.setValueAtTime(accent ? 0.5 : 0.32, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  n.connect(bp); bp.connect(gn); gn.connect(master); n.start(t); n.stop(t + 0.08);
  const o = c.createOscillator(), go = c.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f*0.85, t + 0.06);
  go.gain.setValueAtTime(accent ? 0.45 : 0.3, t); go.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  o.connect(go); go.connect(master); o.start(t); o.stop(t + 0.08);
}
function playDegree(i, t, vel){
  const c = ac(); if(t == null) t = c.currentTime + 0.02; vel = vel || 1;
  const ch = CH[i];
  if(state.view === "guitar" || state.view === "triads"){
    const cv = currentVoicing(i); if(!cv) return;
    let j = 0;
    cv.v.frets.forEach((f, s) => { if(f !== null){ guitarNote(OPEN_MIDI[s] + f, t + j*0.022, 0.42 * vel); j++; } });
    return;
  }
  const r = 60 + ch.root;
  pianoNote(r - 12, t, 0.2 * vel);
  ch.ints.forEach(n => pianoNote(r + n, t, 0.16 * vel));
}

/* ---------- Progression looper ---------- */
const jam = {on:false, timer:null, next:0, step:0, beat:0, nowK:-1, nowDeg:-1};
function startJam(){
  if(!state.prog.length) return;
  stopSeq();
  const c = ac();
  jam.on = true; jam.next = c.currentTime + 0.1; jam.step = 0; jam.beat = 0;
  jam.timer = setInterval(jamTick, 25); jamTick();
  $("#playBtn").textContent = "Stop";
}
function stopJam(){
  if(!jam.on && jam.nowK < 0) return;
  jam.on = false; clearInterval(jam.timer); jam.timer = null;
  jam.nowK = -1; jam.nowDeg = -1;
  $("#playBtn").textContent = "Play";
  $("#nowSym").textContent = "–"; $("#nowNext").textContent = "Press Play to loop";
  markNow();
}
function jamTick(){
  const c = ac();
  while(jam.next < c.currentTime + 0.12){
    const prog = state.prog;
    if(!prog.length){ stopJam(); return; }
    const k = jam.step % prog.length, deg = prog[k], b = jam.beat;
    if(b === 0){
      playDegree(deg, jam.next, 1);
      const when = jam.next;
      setTimeout(() => { if(jam.on) setNow(k, deg); }, Math.max(0, (when - c.currentTime) * 1000));
    } else if(state.beats >= 4 && b === state.beats / 2){
      playDegree(deg, jam.next, 0.55);
    }
    jam.next += 60 / state.bpm;
    jam.beat++;
    if(jam.beat >= state.beats){ jam.beat = 0; jam.step++; }
  }
}
function setNow(k, deg){
  jam.nowK = k; jam.nowDeg = deg;
  const p = state.prog;
  $("#nowSym").textContent = CH[deg] ? CH[deg].sym : "–";
  const nx = CH[p[(k+1) % p.length]];
  $("#nowNext").textContent = nx ? "next " + nx.sym : "";
  markNow();
}
function markNow(){
  $$(".card").forEach(el => el.classList.toggle("now", +el.dataset.i === jam.nowDeg));
  $$(".chip").forEach(el => el.classList.toggle("now", +el.dataset.k === jam.nowK));
}

/* ---------- Scale sequencer ---------- */
const seq = {on:false, id:0, timer:null, next:0, queue:[], gen:null, timbre:"piano", kind:null};
function startSeq(kind, gen, timbre){
  stopSeq(); stopJam();
  const c = ac();
  seq.id++; Object.assign(seq, {on:true, kind, gen, timbre, queue:[], next:c.currentTime + 0.08});
  seq.timer = setInterval(seqTick, 25); seqTick();
  updatePlayButtons();
}
function stopSeq(){
  if(!seq.on && !seq.kind) return;
  seq.on = false; seq.id++; clearInterval(seq.timer); seq.timer = null; seq.kind = null;
  clearHl(); updatePlayButtons();
}
function seqTick(){
  const c = ac(), id = seq.id;
  while(seq.on && seq.next < c.currentTime + 0.12){
    if(!seq.queue.length){
      const r = seq.gen();
      if(!r){
        clearInterval(seq.timer); seq.on = false;
        setTimeout(() => { if(seq.id === id) stopSeq(); }, Math.max(0, (seq.next - c.currentTime) * 1000));
        return;
      }
      seq.queue = r;
    }
    const ev = seq.queue.shift(), t = seq.next;
    if(ev.midis) ev.midis.forEach(m => seq.timbre === "guitar" ? guitarNote(m, t, 0.45) : pianoNote(m, t, ev.vel || 0.22, 1.6));
    if(ev.ui) setTimeout(() => { if(seq.id === id) ev.ui(); }, Math.max(0, (t - c.currentTime) * 1000));
    seq.next += ev.beats * 60 / state.scaleBpm;
  }
}
function clearHl(){ $$(".hl").forEach(el => el.classList.remove("hl")); }
function hl(sel){ clearHl(); $$(sel).forEach(el => el.classList.add("hl")); }
function patternIdx(){
  if(state.scalePattern === "up") return [0,1,2,3,4,5,6,7];
  if(state.scalePattern === "down") return [7,6,5,4,3,2,1,0];
  return [0,1,2,3,4,5,6,7,6,5,4,3,2,1,0];
}
function vocalGen(){
  let base = 12*(state.scaleOct + 1) + state.root, first = true;
  return () => {
    if(!first){
      if(state.scaleAfter === "stop") return null;
      if(state.scaleAfter === "up") base++;
      if(state.scaleAfter === "down") base--;
      if(base < 28 || base > 96) return null;
    }
    first = false;
    const b = base, steps = MODES[state.mode].steps, evs = [];
    evs.push({beats:0, ui:() => { const pc = ((b % 12) + 12) % 12; if(pc !== state.root){ state.root = pc; state.scaleOct = Math.floor(b/12) - 1; render(); } }});
    if(state.scaleCue) evs.push({beats:2, midis:[b - 12, b, b + steps[2], b + steps[4]], vel:0.16, ui:() => hl('.deg[data-d="0"]')});
    patternIdx().forEach(i => evs.push({beats:1, midis:[b + (i < 7 ? steps[i] : 12)], ui:() => hl(`.deg[data-d="${i % 7}"]`)}));
    evs.push({beats:1, ui:clearHl});
    return evs;
  };
}
function shapeGen(){
  const shp = scaleShapes()[state.shapeIdx]; let done = false;
  return () => {
    if(done || !shp) return null; done = true;
    const order = shp.notes.map((_, j) => j);
    const seqIdx = order.concat(order.slice(0, -1).reverse());
    return seqIdx.map(j => ({beats:0.5, midis:[shp.notes[j].m], ui:() => hl(`.fd[data-n="${j}"]`)})).concat([{beats:1, ui:clearHl}]);
  };
}
function pianoScaleGen(){
  let done = false;
  return () => {
    if(done) return null; done = true;
    const ms = scaleMidis();
    return patternIdx().map(i => ({beats:1, midis:[ms[i]], ui:() => hl(`.pk[data-m="${ms[i]}"]`)})).concat([{beats:1, ui:clearHl}]);
  };
}
function updatePlayButtons(){
  $$("[data-seq]").forEach(b => {
    const on = seq.kind === b.dataset.seq;
    b.textContent = on ? "Stop" : b.dataset.label;
    b.setAttribute("aria-pressed", on);

}

const metro = {on:false, timer:null, next:0, beat:0};
function metroStart(){

function metroTick(){

  if(d.vnext != null || d.vprev != null){

  }

  else if(d.psub){ stopSeq(); state.pSub = d.psub; }
  else if(d.size){ state.seventh = d.size === "7"; state.voicing = {}; }

$("#panel").addEventListener("change", e => {
  const t = e.target;
  if(t.matches("[data-pattern]")) state.scalePattern = t.value;
  else if(t.matches("[data-oct]")) state.scaleOct = +t.value;
  else if(t.matches("[data-cue]")) state.scaleCue = t.checked;
  save();
});
$("#prog").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.chip != null){ playDegree(state.prog[+b.dataset.chip]); }
  else if(b.dataset.remove != null){
    state.prog.splice(+b.dataset.remove, 1);
    if(!state.prog.length && jam.on) stopJam();
    jam.nowK = -1; renderJam(); markNow(); save();
  }
});
$("#preset").addEventListener("change", e => {
  const v = e.target.value; if(v === "") return;
  state.prog = PRESETS[state.mode][+v][0].slice(); jam.step = 0; jam.nowK = -1;
  renderJam(); save();
});
$("#playBtn").addEventListener("click", () => jam.on ? stopJam() : startJam());
$("#clearBtn").addEventListener("click", () => { state.prog = []; if(jam.on) stopJam(); renderJam(); save(); });
$("#bpm").addEventListener("input", e => { state.bpm = +e.target.value; $("#bpmVal").textContent = state.bpm; save(); });
$("#beats").addEventListener("change", e => { state.beats = +e.target.value; jam.beat = 0; save(); });

/* metronome */
function setMetroOpen(open){
  $("#metroPop").hidden = !open;
  $("#metroBtn").setAttribute("aria-expanded", open);
}
$("#metroBtn").addEventListener("click", () => setMetroOpen($("#metroPop").hidden));
$("#metroToggle").addEventListener("click", () => metro.on ? metroStop() : metroStart());
$("#metroDown").addEventListener("click", () => setMetroBpm(state.metroBpm - 1));
$("#metroUp").addEventListener("click", () => setMetroBpm(state.metroBpm + 1));
$("#metroRange").addEventListener("input", e => setMetroBpm(+e.target.value));
document.addEventListener("click", e => {
  if($("#metroPop").hidden) return;
  if(!e.target.closest("#metroPop") && !e.target.closest("#metroBtn")) setMetroOpen(false);
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !$("#metroPop").hidden){ setMetroOpen(false); $("#metroBtn").focus(); return; }
  if(e.target.matches("input, select") || !state.view) return;
  if(e.code === "Space" && !e.target.closest("button")){ e.preventDefault(); jam.on ? stopJam() : startJam(); }
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 7 && !e.metaKey && !e.ctrlKey) playDegree(n - 1);
});
window.addEventListener("resize", dock);

render();
metroUI();
})();
</script>
</body>
</html>
